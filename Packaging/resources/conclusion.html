<p>끝났습니다. 화면 위쪽 메뉴바에 <b>체크리스트 아이콘</b>이 보일 겁니다.</p>

<p>안 보인다면 메뉴바가 꽉 찼을 수 있습니다.
다른 아이콘을 <code>⌘</code> 를 누른 채 끌어 자리를 비워 보세요.</p>

<p>끄고 싶으면 패널 오른쪽 위 <code>⋯</code> → <code>종료</code>.
자동 실행은 같은 메뉴의 <code>로그인할 때 자동 실행</code> 에서 끕니다.</p>
</body>
</html>
