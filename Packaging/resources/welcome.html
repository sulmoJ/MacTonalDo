<!DOCTYPE html>

<head><meta charset="utf-8"></head>
<body style="font: -apple-system-body; font-family: -apple-system, sans-serif; margin: 0;">
<p><b>MacTonalDo</b> 는 맥북 메뉴바에 사는 할 일 앱입니다.
상단 막대의 체크리스트 아이콘을 누르면 패널이 열립니다.</p>

<p>설치하면 이렇게 됩니다.</p>
<ul>
  <li><code>/Applications</code> 에 앱이 들어갑니다.</li>
  <li>설치가 끝나면 바로 실행됩니다. Dock 에는 뜨지 않습니다.</li>
  <li>처음 실행할 때 <b>로그인하면 자동으로 켜지도록</b> 한 번 등록합니다.
      원치 않으면 패널 오른쪽 위 <code>⋯</code> 메뉴에서 끄면 됩니다.</li>
</ul>

<p>할 일은 이 맥 안에만 저장됩니다. 네트워크는 쓰지 않습니다.</p>
</body>
</html>
